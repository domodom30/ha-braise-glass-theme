  # ===========================================================================
  modes:
    # =========================================================================
    #  DARK — mode de référence (verre noir fumé + bords incandescents)
    # =========================================================================
    dark: &dark
      # --- Surfaces de verre (tokens) ----------------------------------------
      glass-surface: &d_surface "linear-gradient(160deg, rgba(255, 255, 255, 0.07) 0%, rgba(26, 18, 16, 0.42) 42%, rgba(20, 12, 10, 0.56) 100%)"
      glass-surface-solid: &d_surface_solid "rgba(26, 18, 16, 0.95)"
      glass-surface-strong: &d_surface_strong "rgba(22, 15, 13, 0.80)"
      glass-surface-raised: &d_surface_raised "rgba(255, 122, 26, 0.08)"
      glass-surface-hover: &d_surface_hover "rgba(255, 122, 26, 0.12)"
      glass-surface-active: &d_surface_active "rgba(255, 122, 26, 0.20)"
      glass-surface-selected: &d_surface_selected "rgba(255, 106, 31, 0.26)"
      glass-surface-input: &d_surface_input "rgba(10, 7, 6, 0.50)"
      glass-surface-input-hover: &d_surface_input_hover "rgba(20, 13, 11, 0.65)"
      glass-accent-surface: &d_accent_surface "linear-gradient(140deg, rgba(255, 138, 61, 0.92) 0%, rgba(255, 106, 31, 0.82) 50%, rgba(255, 61, 46, 0.78) 100%)"
      glass-border: &d_border "rgba(255, 122, 26, 0.20)"
      glass-border-strong: &d_border_strong "rgba(255, 138, 61, 0.36)"
      glass-border-glow: &d_border_glow "rgba(255, 106, 31, 0.65)"
      glass-divider: &d_divider "rgba(255, 170, 120, 0.12)"
      glass-highlight: "rgba(255, 255, 255, 0.22)"
      # Bord spéculaire : reflet blanc en haut, braise orange en bas (comme sur la TV)
      glass-shadow: &d_shadow "0 10px 34px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.20), inset 0 -1px 0 rgba(255, 106, 31, 0.55), 0 8px 22px -12px rgba(255, 106, 31, 0.45)"
      glass-shadow-hover: "0 16px 44px rgba(0, 0, 0, 0.60), 0 0 0 1px rgba(255, 122, 26, 0.32), 0 0 26px rgba(255, 106, 31, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.24), inset 0 -1px 0 rgba(255, 106, 31, 0.80)"
      glass-shadow-dialog: &d_shadow_dialog "0 30px 80px rgba(0, 0, 0, 0.70), 0 0 0 1px rgba(255, 122, 26, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(255, 106, 31, 0.50)"
      glass-glow: "0 0 18px rgba(255, 106, 31, 0.50)"
      glass-scrollbar: &d_scrollbar "rgba(255, 122, 26, 0.32)"
      glass-page-background: &d_page "url(\"data:image/svg+xml;base64,\") center bottom / cover no-repeat fixed, radial-gradient(ellipse 90% 55% at 50% 115%, rgba(255, 77, 18, 0.55) 0%, transparent 65%) fixed, radial-gradient(ellipse 45% 40% at 90% 8%, rgba(255, 122, 26, 0.18) 0%, transparent 60%) fixed, radial-gradient(ellipse 40% 45% at 5% 52%, rgba(255, 59, 48, 0.14) 0%, transparent 60%) fixed, linear-gradient(165deg, #0C0A0B 0%, #070607 50%, #0B0706 100%) fixed"


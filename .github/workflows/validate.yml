name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: theme

  theme:
    name: Theme checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Distributed theme is up to date with src/ and assets/
        run: |
          python tools/build_theme.py
          git diff --exit-code themes/braise_glass.yaml
      - name: Schema, references and contrast
        run: python tools/validate_theme.py

  # ===========================================================================
  # 5. CARD-MOD — raffinements optionnels (nécessite card-mod ≥ 3.4)
  #    Mêmes classes que Blue Glass : un tableau de bord passe d'un thème à
  #    l'autre sans retouche.
  #    ⚠ La valeur de card-mod-theme DOIT être identique au nom du thème.
  # ===========================================================================
  card-mod-theme: "Braise Glass"

  # --- Cartes : hover, reflet, variantes par classe --------------------------
  #   card_mod:
  #     class: glass-accent   → verre incandescent (carte "héro")
  #     class: glass-strong   → verre plus opaque (lisibilité max)
  #     class: glass-clear    → verre très léger
  #     class: glass-flat     → sans fond ni bordure (intégration dans une pile)
  #     class: glass-glow     → bordure lumineuse orange
  card-mod-card: |
    ha-card {
      transition: box-shadow var(--glass-transition), border-color var(--glass-transition), transform var(--glass-transition), background var(--glass-transition);
    }
    @media (hover: hover) {
      ha-card:not(.glass-flat):hover {
        box-shadow: var(--glass-shadow-hover);
        border-color: var(--glass-border-strong);
      }
    }
    ha-card.glass-accent {
      --ha-card-background: var(--glass-accent-surface);
      --ha-card-border-color: var(--glass-accent-border);
      --primary-text-color: var(--glass-on-accent);
      --secondary-text-color: var(--glass-on-accent-secondary);
      --state-icon-color: var(--glass-on-accent);
      --paper-item-icon-color: var(--glass-on-accent);
      color: var(--glass-on-accent);
    }
    ha-card.glass-strong {
      --ha-card-background: var(--glass-surface-strong);
    }
    ha-card.glass-clear {
      --ha-card-background: var(--glass-surface-raised);
      --ha-card-box-shadow: none;
    }
    ha-card.glass-flat {
      --ha-card-background: transparent;
      --ha-card-border-color: transparent;
      --ha-card-box-shadow: none;
      --ha-card-backdrop-filter: none;
    }
    ha-card.glass-glow {
      --ha-card-border-color: var(--glass-border-glow);
      --ha-card-box-shadow: var(--glass-shadow), var(--glass-glow);
    }
    @media (prefers-reduced-transparency: reduce) {
      ha-card {
        --ha-card-background: var(--glass-surface-solid);
        --ha-card-backdrop-filter: none;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      ha-card { transition: none; }
    }

  # --- Header Lovelace : verre flouté (secours) ------------------------------
  card-mod-root: |
    .header {
      -webkit-backdrop-filter: var(--app-header-backdrop-filter);
      backdrop-filter: var(--app-header-backdrop-filter);
    }

# =============================================================================
#  BRAISE GLASS LITE — même design, sans flou (performances)
#  Recommandé pour : tablettes murales anciennes, Fully Kiosk, Raspberry Pi,
#  navigateurs sans GPU. Surfaces plus opaques pour rester lisibles.
# =============================================================================
Braise Glass Lite:
  <<: *braise_glass
  card-mod-theme: "Braise Glass Lite"
  glass-blur: "none"
  glass-blur-strong: "none"
  glass-blur-soft: "none"
  glass-blur-scrim: "none"
  ha-card-backdrop-filter: "none"
  app-header-backdrop-filter: "none"
  ha-dialog-surface-backdrop-filter: "none"
  ha-dialog-scrim-backdrop-filter: "none"
  dialog-backdrop-filter: "none"
  modes:
    dark:
      <<: *dark
      glass-surface: &lite_d_surface "linear-gradient(160deg, rgba(48, 32, 26, 0.80) 0%, rgba(26, 18, 16, 0.86) 45%, rgba(20, 12, 10, 0.90) 100%)"
      ha-card-background: *lite_d_surface
      app-header-background-color: "rgba(10, 7, 6, 0.95)"
      ha-dialog-surface-background: "rgba(22, 15, 13, 0.97)"
      bubble-pop-up-background-color: "rgba(16, 11, 10, 0.96)"
      bubble-main-background-color: "rgba(30, 21, 18, 0.80)"
    light:
      <<: *light
      glass-surface: &lite_l_surface "linear-gradient(160deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 249, 244, 0.86) 50%, rgba(255, 232, 214, 0.80) 100%)"
      ha-card-background: *lite_l_surface
      app-header-background-color: "rgba(252, 246, 240, 0.96)"
      ha-dialog-surface-background: "rgba(255, 250, 246, 0.98)"
      bubble-pop-up-background-color: "rgba(252, 246, 240, 0.97)"
      bubble-main-background-color: "rgba(255, 255, 255, 0.86)"

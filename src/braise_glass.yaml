  mush-rgb-lime: "198, 232, 107"
  mush-rgb-yellow: "255, 224, 122"
  mush-rgb-amber: "255, 209, 102"
  mush-rgb-orange: "255, 122, 26"
  mush-rgb-deep-orange: "255, 106, 31"
  mush-rgb-brown: "185, 138, 110"
  mush-rgb-grey: "168, 146, 134"
  mush-rgb-blue-grey: "138, 122, 114"
  mush-rgb-info: "90, 200, 250"
  mush-rgb-success: "61, 220, 151"
  mush-rgb-warning: "255, 209, 102"
  mush-rgb-danger: "255, 77, 106"
  mush-rgb-state-light: "255, 194, 122"
  mush-rgb-state-fan: "255, 122, 26"
  mush-rgb-state-cover: "255, 138, 61"
  mush-rgb-state-media-player: "167, 139, 250"

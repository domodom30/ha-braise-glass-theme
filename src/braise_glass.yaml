  mush-rgb-state-person-unknown: "138, 122, 114"

  # --- Bubble Card (tokens communs) ------------------------------------------
  bubble-accent-color: *ember
  bubble-border-radius: *radius_card
  bubble-button-border-radius: *radius_md
  bubble-pop-up-border-radius: *radius_dialog
  bubble-icon-border-radius: "50%"
  bubble-select-list-border-radius: *radius_md
  # Carte serrure : verrouillée = accent ; déverrouillée/ouverte/bloquée = rouge
  bubble-lock-warning-color: *error
  # Halo de l'icône « allumé » (module bubble blue_glass_state)
  blue-glass-icon-glow-blur: "4px"
  blue-glass-icon-glow-alpha: "0.55"
  blue-glass-icon-halo-blur: "8px"
  blue-glass-icon-halo-alpha: "0.28"
  blue-glass-slider-fill-alpha: "0.38"
  # Séparateurs (module bubble blue_glass_separator)

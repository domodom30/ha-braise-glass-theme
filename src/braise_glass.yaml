# =============================================================================
#  BRAISE GLASS — Ember Glassmorphism theme for Home Assistant
#  Version : 1.0.1
#  Inspiration : thème « Braise » (Ember) de Domo TV — verre noir fumé,
#                bords orange incandescents, braises qui montent
#
#  Thèmes fournis :
#    • Braise Glass       → thème complet (modes dark + light), blur activé
#    • Braise Glass Lite  → même design, sans backdrop-filter (tablettes/SBC lents)
#
#  Décor de fond : SVG intégré au thème (data URI) — aucun fichier à copier.
#    Source : assets/braise_glass_{dark,light}.svg (tools/make_backdrop.py),
#    intégré par tools/build_theme.py.
#
#  Variables --blue-glass-* : teinte « allumé » et séparateurs lus par des
#  modules Bubble Card optionnels (voir README).
#
#  Organisation du fichier :
#    1. TOKENS        → palette, transparences, ombres, blur, rayons, bordures
#    2. SÉMANTIQUE    → variables officielles HA (couleurs, textes, états…)
#    3. COMPOSANTS    → cartes, header, sidebar, dialogs, inputs, switches…
#    4. CUSTOM CARDS  → Mushroom, Bubble Card, mini-media-player
#    5. CARD-MOD      → raffinements optionnels (ignorés sans card-mod)
# =============================================================================

Braise Glass: &braise_glass
  # ===========================================================================
  # 1. TOKENS — communs aux deux modes
  # ===========================================================================

  # --- Palette de marque (Domo TV « Ember ») -----------------------------------
  braise-coal-950: &coal_950 "#070708"   # fond (BG)
  braise-coal-900: &coal_900 "#0E0A09"   # barre latérale (SIDE)
  braise-coal-800: &coal_800 "#1A1210"   # carte (CARD)
  braise-coal-700: &coal_700 "#261A15"
  braise-coal-600: &coal_600 "#35241C"
  braise-ember: &ember "#FF6A1F"         # lueur / focus (couleur de référence)
  braise-ember-light: &ember_light "#FF8A3D"
  braise-ember-dark: &ember_dark "#D9500F"
  braise-flame: &flame "#FF7A1A"         # accent
  braise-gold: &gold "#FFC27A"           # braises claires
  braise-red: &red "#FF3B30"             # second ton des dégradés
  braise-ash: &ash "#FFF4EC"             # texte
  braise-white: &white "#FFFFFF"

  # --- Texte sur surface accent (carte "héro" incandescente) -----------------
  glass-on-accent: *white
  glass-on-accent-secondary: "rgba(255, 255, 255, 0.84)"
  glass-accent-border: "rgba(255, 194, 122, 0.50)"

  # --- Couleurs fonctionnelles (sévérités) -----------------------------------
  # Volontairement éloignées de l'orange de marque pour rester lisibles.
  glass-success: &success "#3DDC97"
  glass-warning: &warning "#FFD166"
  glass-error: &error "#FF4D6A"
  glass-info: &info "#5AC8FA"
  glass-violet: &violet "#A78BFA"
  glass-magenta: &magenta "#F472B6"
  glass-orange: &orange "#FF7A1A"

  # --- Blur / flou ------------------------------------------------------------
  glass-blur: &blur "blur(22px) saturate(160%)"
  glass-blur-strong: &blur_strong "blur(34px) saturate(170%)"
  glass-blur-soft: &blur_soft "blur(10px) saturate(140%)"
  glass-blur-scrim: &blur_scrim "blur(6px)"

  # --- Rayons -----------------------------------------------------------------
  glass-radius-xs: &radius_xs "8px"
  glass-radius-sm: &radius_sm "12px"
  glass-radius-md: &radius_md "18px"
  glass-radius-lg: &radius_lg "24px"
  glass-radius-xl: &radius_xl "30px"
  glass-radius-pill: &radius_pill "999px"
  glass-radius-card: &radius_card "16px"
  glass-radius-dialog: &radius_dialog "20px"

  # --- Bordures / épaisseurs --------------------------------------------------
  glass-border-width: &border_width "1px"

  # --- Animations -------------------------------------------------------------
  glass-transition: "180ms cubic-bezier(0.2, 0.8, 0.2, 1)"

  # --- Typographie ------------------------------------------------------------
  ha-font-family-body: &font "Inter, \"SF Pro Display\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
  ha-font-family-heading: *font
  primary-font-family: *font
  paper-font-common-base_-_font-family: *font
  mdc-typography-font-family: *font
  ha-card-header-font-size: "20px"
  ha-font-weight-bold: "600"

  # --- Rayons appliqués aux composants HA -------------------------------------
  ha-card-border-radius: *radius_card
  ha-card-border-width: *border_width
  ha-border-radius-sm: *radius_xs
  ha-border-radius-md: *radius_sm
  ha-border-radius-lg: *radius_md
  ha-border-radius-xl: *radius_lg
  ha-border-radius-2xl: *radius_xl
  ha-border-radius-pill: *radius_pill
  ha-dialog-border-radius: *radius_dialog
  ha-badge-border-radius: *radius_pill
  ha-tooltip-border-radius: *radius_sm
  feature-border-radius: *radius_sm
  control-button-border-radius: *radius_sm
  control-select-border-radius: *radius_sm
  control-slider-border-radius: *radius_sm
  control-switch-border-radius: *radius_sm
  ha-assist-chip-container-shape: *radius_pill
  ha-chip-border-radius: *radius_pill
  mdc-shape-small: *radius_sm
  mdc-shape-medium: *radius_md
  mdc-shape-large: *radius_card
  md-menu-container-shape: *radius_md
  md-dialog-container-shape: *radius_dialog
  md-filled-text-field-container-shape: *radius_sm
  md-outlined-text-field-container-shape: *radius_sm
  md-filled-select-text-field-container-shape: *radius_sm
  md-outlined-select-text-field-container-shape: *radius_sm

  # --- Flou appliqué aux composants HA ----------------------------------------
  ha-card-backdrop-filter: *blur
  app-header-backdrop-filter: *blur_strong
  ha-dialog-surface-backdrop-filter: *blur_strong
  ha-dialog-scrim-backdrop-filter: *blur_scrim
  dialog-backdrop-filter: *blur_scrim

  # --- Couleurs nommées (attribut `color:` des cartes/badges) ----------------
  primary-color: *ember
  accent-color: *flame
  blue-color: "#4F8DFF"
  light-blue-color: *info
  cyan-color: "#38D6E8"
  teal-color: "#2CC9B4"
  green-color: *success
  light-green-color: "#86E39B"
  lime-color: "#C6E86B"
  yellow-color: "#FFE07A"
  amber-color: *warning
  orange-color: *flame
  deep-orange-color: *ember
  red-color: *error
  pink-color: *magenta
  purple-color: "#C084FC"
  deep-purple-color: *violet
  indigo-color: "#818CF8"
  brown-color: "#B98A6E"
  grey-color: "#A89286"
  blue-grey-color: "#8A7A72"

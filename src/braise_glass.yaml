  state-alarm_control_panel-armed_vacation-color: *success
  state-alarm_control_panel-armed_custom_bypass-color: *success
  state-alarm_control_panel-arming-color: *warning
  state-alarm_control_panel-pending-color: *warning
  state-alarm_control_panel-disarmed-color: *ember_light
  state-alarm_control_panel-triggered-color: *error
  state-person-home-color: *success
  state-person-not_home-color: "#8A7A72"
  state-device_tracker-home-color: *success
